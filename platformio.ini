[platformio]
default_envs = esp32-s3-devkitm-1

; ── Shared base settings ───────────────────────────────────────────────────────
; Applied to every [env:*] unless explicitly overridden.
[env]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 16MB
board_build.psram = enabled
lib_deps = sandeepmistry/LoRa
build_flags =
    -I include
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ── macOS environment (default) ────────────────────────────────────────────────
; pio run                        → build
; pio run --target upload        → upload
; pio device monitor             → monitor
[env:esp32-s3-devkitm-1]
; upload_port = /dev/cu.usbmodem1101   ; the author's Mac; PlatformIO finds the board by itself, or pass --upload-port
; monitor_port = /dev/cu.usbmodem1101   ; the author's Mac; PlatformIO finds the board by itself, or pass --upload-port

; ── Diagnostic RF environment ──────────────────────────────────────────────────
[env:diagnostic-gateway]
; upload_port = /dev/cu.usbmodem1101   ; the author's Mac; PlatformIO finds the board by itself, or pass --upload-port
; monitor_port = /dev/cu.usbmodem1101   ; the author's Mac; PlatformIO finds the board by itself, or pass --upload-port
build_flags =
    -I include
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D TW_RF_DIAGNOSTIC=1

; ── Windows environment ────────────────────────────────────────────────────────
; pio run -e windows --target upload   → upload
; pio device monitor -e windows        → monitor
; COM8 / COM10 detected (VID_1A86 / PID_55D3 — CH343 USB-Serial).
; Update the port below to whichever COM port this board enumerates as.
[env:windows]
; upload_port = COM10   ; the author's Mac; PlatformIO finds the board by itself, or pass --upload-port
; monitor_port = COM10   ; the author's Mac; PlatformIO finds the board by itself, or pass --upload-port
